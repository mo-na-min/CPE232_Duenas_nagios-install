---
- hosts: all
  become: true
  tasks:

    - name: Install Nagios (Ubuntu)
      apt:
        name:
          - nagios4
          - apache2-utils
          - apache2
          - libapache2-mod-php
          - libgd-dev
          - python3-passlib
        state: latest
        update_cache: yes
      when: ansible_distribution == "Ubuntu"

    - name: Enable CRB Repository (CentOS)
      ansible.builtin.command: dnf config-manager --set-enable crb
      when: ansible_distribution == "CentOS"

    - name: Install Nagios (CentOS)
      dnf:
        name:
          - nagios
          - httpd
        state: latest
        update_cache: yes
      when: ansible_distribution == "CentOS"

